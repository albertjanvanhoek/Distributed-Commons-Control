name: Model and Formalization Checks

on:
  push:
    branches:
      - main
  pull_request:
    paths-ignore:
      - "docs/JAM_RESEARCHER_BRIEF.pdf"

permissions:
  contents: read

# Keep only the newest run for a PR/ref. Rapid proof-development commits were
# otherwise leaving several expensive Lean/mathlib jobs running in parallel.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install package
        run: python -m pip install -e .
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Reproduce phase sweep
        run: python scripts/run_experiment.py --output results/phase_sweep.csv
      - name: Reproduce exact phase boundary
        run: python scripts/phase_boundary.py --output results/static_phase_boundary.csv

      - name: Reproduce dynamic feedback experiment
        run: python scripts/feedback_experiment.py --output results/feedback.csv
      - name: Reproduce closed-loop commons experiment
        run: python scripts/closed_loop_experiment.py --output-dir results
      - name: Reproduce viability contribution experiment
        run: python scripts/viability_contribution_experiment.py --output results/viability_contribution.csv
      - name: Reproduce JAM / ELVES grounding check
        run: python -m unittest tests/test_jam_elves.py
      - name: Reproduce selected viability experiment
        run: python scripts/selected_viability_experiment.py --output results/selected_viability.csv
      - name: Reproduce corrective capacity experiment
        run: python scripts/corrective_capacity_experiment.py --output results/corrective_capacity.csv
      - name: Reproduce state-dependent contribution experiment
        run: python scripts/state_dependent_contribution_experiment.py --output results/state_dependent_contribution.csv
      - name: Reproduce vector contribution experiment
        run: python scripts/vector_contribution_experiment.py
      - name: Reproduce behavioral maintenance experiment
        run: python scripts/behavioral_maintenance_experiment.py --output results/behavioral_maintenance.csv
      - name: Reproduce JAM maintenance operator experiment
        run: python scripts/jam_maintenance_experiment.py --output results/jam_maintenance.csv
      - name: Reproduce JAM behavior-selection experiment
        run: python scripts/jam_behavior_selection_experiment.py
      - name: Reproduce JAM effort-observability experiment
        run: python scripts/jam_effort_observability_experiment.py
      - name: Reproduce fungal flow-maintenance experiment
        run: python scripts/fungal_flow_maintenance_experiment.py --output results/fungal_flow_maintenance.csv

  lean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build Lean formalization
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: formalization
          auto-config: false
          build: true
          test: false
          lint: false
          use-mathlib-cache: true
          use-github-cache: true
