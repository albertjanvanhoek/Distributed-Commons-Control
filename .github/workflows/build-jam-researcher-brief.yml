name: Build JAM researcher brief PDF

on:
  push:
    paths:
      - "docs/JAM_RESEARCHER_BRIEF.tex"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: jam-researcher-brief-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-pdf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Install LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            latexmk \
            texlive-latex-base \
            texlive-latex-recommended \
            texlive-latex-extra \
            texlive-fonts-recommended \
            texlive-pictures

      - name: Compile researcher brief
        run: |
          mkdir -p build/jam-researcher-brief
          latexmk -pdf -interaction=nonstopmode -halt-on-error \
            -output-directory=build/jam-researcher-brief \
            docs/JAM_RESEARCHER_BRIEF.tex
          cp build/jam-researcher-brief/JAM_RESEARCHER_BRIEF.pdf \
            docs/JAM_RESEARCHER_BRIEF.pdf

      - name: Commit generated PDF when changed
        run: |
          if git diff --quiet -- docs/JAM_RESEARCHER_BRIEF.pdf; then
            echo "Generated PDF is unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/JAM_RESEARCHER_BRIEF.pdf
          git commit -m "Regenerate JAM researcher brief PDF"
          git push origin HEAD:${{ github.ref_name }}
