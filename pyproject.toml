[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "distributed-commons-control"
version = "0.1.0"
description = "Minimal models of distributed control of jointly maintained state"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [
  {name = "Albert Jan van Hoek"}
]
dependencies = []

[project.urls]
Repository = "https://github.com/albertjanvanhoek/Distributed-Commons-Control"

[tool.setuptools.packages.find]
where = ["src"]
